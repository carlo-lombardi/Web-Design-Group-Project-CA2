  <!-- Bootstrap Icons -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<body>

  <header>
    <!-- #3 Shared header and navbar -->
    <div class="top-strip text-center py-1">
      <i class="bi bi-truck"></i> Free delivery in Ireland on orders over €40
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-vw">
      <div class="container">
        <a class="navbar-brand" href="index.html"><i class="bi bi-droplet-half"></i> VitaWave</a>

        <!-- Basket icon and menu button stay visible on mobile -->
        <div class="d-flex align-items-center order-lg-last">
          <a href="basket.html" class="basket-link position-relative" aria-label="Go to basket">
            <i class="bi bi-basket2"></i>
            <span id="basket-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary">0</span>
          </a>
          <button class="navbar-toggler ms-3" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Open menu">
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-lg-4">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="black-friday.html">Black Friday</a></li>
            <li class="nav-item"><a class="nav-link" href="basket.html">Basket</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="help.html">Help</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <!-- #12 Help page content: header, info cards, address and opening hours -->
    <!-- #13 FAQ accordion -->
    <!-- #14 Contact form -->
    
<section class="container my-5">
  <h2 class="mb-4">Contact Us</h2>
  <p>
    Have a question? Send us a message using the form below.
  </p>

  <form id="contactForm" novalidate>
    <div class="mb-3">
      <label for="contactName" class="form-label">
        Full Name
      </label>
      <input type="text" class="form-control"
        id="contactName" name="name" required>
    </div>

    <div class="mb-3">
      <label for="contactEmail" class="form-label">
        Email Address
      </label>
      <input type="email" class="form-control"
        id="contactEmail" name="email" required>
    </div>

    <div class="mb-3">
      <label for="contactSubject" class="form-label">
        Subject
      </label>
      <select class="form-select"
        id="contactSubject" name="subject" required>
        <option value="">Choose a subject</option>
        <option value="delivery">Delivery</option>
        <option value="returns">Returns</option>
        <option value="products">Products</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="contactMessage" class="form-label">
        Message
      </label>
      <textarea class="form-control"
        id="contactMessage" name="message"
        rows="5" required></textarea>
    </div>

    <button type="submit" class="btn btn-primary">
      Send Message
    </button>

    <div id="contactFeedback"
      class="mt-3" role="status" aria-live="polite">
    </div>
  </form>
</section>

  </main>

  <footer>
    <!-- #4 Shared footer -->
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/basket.js"></script>
  <script src="js/faq.js"></script>
  <script src="js/validation.js"></script>
</body>
</html>
